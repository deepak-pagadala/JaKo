<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Learning App</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="bg-common">
    <div class="container">
        <h1>Welcome to JaKo - Language Learning App</h1>
        <a href="/language" class="btn">Start Learning</a>
    </div>

    <!-- Feedback Button -->
    <button id="feedback-btn" aria-label="Open feedback form">?</button>

    <!-- Feedback Form -->
    <div id="feedback-form" style="display: none;">
        <h4>Feedback</h4>
        <p>Thank you for playing JaKo! We hope you're having fun. Let us know any suggestions or improvements!</p>

        <!-- Email Input Field -->
        <input type="email" id="user-email" placeholder="Enter your email" required>
        <div id="email-error" style="color: red; display: none;">Please enter a valid email address.</div>

        <!-- Feedback Text -->
        <textarea id="feedback-text" maxlength="100" placeholder="Type your feedback here..." required></textarea>
        <div id="feedback-error" style="color: red; display: none;">Feedback cannot be empty.</div>

        <!-- Rating Section -->
        <div id="rating">
            <span class="star" data-value="1">&#9734;</span>
            <span class="star" data-value="2">&#9734;</span>
            <span class="star" data-value="3">&#9734;</span>
            <span class="star" data-value="4">&#9734;</span>
            <span class="star" data-value="5">&#9734;</span>
        </div>

        <button id="submit-feedback" class="btn">Submit</button>
    </div>

    <!-- Feedback Success Message -->
    <div id="feedback-success" style="display: none;">Feedback sent successfully!</div>

    <script>
        const feedbackBtn = document.getElementById('feedback-btn');
        const feedbackForm = document.getElementById('feedback-form');
        const userEmail = document.getElementById('user-email');
        const feedbackText = document.getElementById('feedback-text');
        const emailError = document.getElementById('email-error');
        const feedbackError = document.getElementById('feedback-error');
        const feedbackSuccess = document.getElementById('feedback-success');
        const submitFeedbackBtn = document.getElementById('submit-feedback');
        let selectedRating = 0;

        const stars = document.querySelectorAll('#rating .star');

        // Toggle feedback form visibility
        feedbackBtn.addEventListener('click', () => {
            feedbackForm.style.display = feedbackForm.style.display === 'none' ? 'block' : 'none';
        });

        // Star rating functionality
        stars.forEach(star => {
            star.addEventListener('click', function () {
                selectedRating = parseInt(this.getAttribute('data-value'));
                stars.forEach(s => s.innerHTML = '&#9734;'); // Reset all stars
                for (let i = 0; i < selectedRating; i++) {
                    stars[i].innerHTML = '&#9733;'; // Fill stars up to selected rating
                }
            });
        });

        // Email validation using regex
        function validateEmail(email) {
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailPattern.test(email);
        }

        submitFeedbackBtn.addEventListener('click', () => {
            const emailValue = userEmail.value;
            const feedbackTextValue = feedbackText.value.trim();

            // Validate email and feedback text
            let isValid = true;

            if (!validateEmail(emailValue)) {
                emailError.style.display = 'block';
                isValid = false;
            } else {
                emailError.style.display = 'none';
            }

            if (!feedbackTextValue) {
                feedbackError.style.display = 'block';
                isValid = false;
            } else {
                feedbackError.style.display = 'none';
            }

            if (!isValid) return;

            // Close feedback form
            feedbackForm.style.display = 'none';

            // Show success message
            feedbackSuccess.style.display = 'block';
            setTimeout(() => {
                feedbackSuccess.style.display = 'none';
            }, 1000);

            // Submit feedback via fetch
            fetch('/submit_feedback', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email: emailValue,
                    feedback: feedbackTextValue,
                    rating: selectedRating
                })
            })
                .then(response => response.json())
                .then(data => {
                    console.log('Feedback submitted:', data);
                    userEmail.value = ''; // Reset fields
                    feedbackText.value = '';
                    stars.forEach(s => s.innerHTML = '&#9734;'); // Reset stars
                    selectedRating = 0;
                })
                .catch(error => {
                    console.error('Error submitting feedback:', error);
                });
        });
    </script>
</body>
</html>
