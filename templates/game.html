<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game - Learn {{ language|capitalize }} Vocabulary</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body class="{{ 'bg-japanese' if language == 'japanese' else 'bg-korean' }}">
    <div id="header">
        <h1>Learning {{ category|capitalize }} in {{ language|capitalize }}</h1>
        <div id="score-board">
            <div id="lives">
                <img src="{{ url_for('static', filename='images/lives/' + ('bamboo.png' if language == 'japanese' else 'crown.png')) }}" class="heart" id="heart1">
                <img src="{{ url_for('static', filename='images/lives/' + ('bamboo.png' if language == 'japanese' else 'crown.png')) }}" class="heart" id="heart2">
                <img src="{{ url_for('static', filename='images/lives/' + ('bamboo.png' if language == 'japanese' else 'crown.png')) }}" class="heart" id="heart3">
            </div>
            <div id="score">Score: 0</div>
        </div>
    </div>

    <!-- Character Image -->
    <div id="game-container" style="position: relative;">
        <img id="character" 
             src="{{ url_for('static', filename='images/characters/' + ('panda.png' if language == 'japanese' else 'tiger.png')) }}" 
             style="position: absolute; bottom: -100px; left: 0; width: 100px; height: 100px;">
        
        <!-- Object Image -->
        <img id="object" 
             src="{{ url_for('static', filename='images/lives/' + ('bamboo.png' if language == 'japanese' else 'crown.png')) }}" 
             style="position: absolute; bottom: -110px; right: 0; width: 80px; height: 80px;">
        
        <div id="repeat-label" style="display: none;">Repeat Word</div>
    </div>

    <div id="footer">
        <div id="input-container">
            <input type="text" id="answer-input" placeholder="Type your answer here" autofocus>
            <button id="submit-btn" class="btn">Submit</button>
            <button id="reset-btn" class="btn">Reset</button>
        </div>
    </div>
    <div id="level-up-notification" style="display: none;">
        <img src="{{ url_for('static', filename='images/levelup.png') }}" alt="Level Up!">
    </div>
    
    <!-- Background Music -->
    <audio id="background-music" loop>
        <source src="{{ url_for('static', filename='audio/' + ('japanese.mp3' if language == 'japanese' else 'korean.mp3')) }}" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>
    
    <script>
        const language = "{{ language }}";
        const category = "{{ category }}";
        const mode = "{{ mode }}";
    </script>
    <script src="{{ url_for('static', filename='phaser.min.js') }}"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>

</html>
